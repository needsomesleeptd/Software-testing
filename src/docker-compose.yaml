services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention=12h'
      - '--storage.tsdb.wal-compression'

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    depends_on:
      - prometheus


 

  echo-hello:
    container_name: echo-hello
    build:
     context: ./test_apps/echo
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "1"

    depends_on:
      - prometheus

  gin-hello:
    container_name: gin-hello
    build:
     context: ./test_apps/echo
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          cpus: "1"
    depends_on:
      - prometheus

  
  gatling-at-once:
    image: denvazh/gatling:latest
    container_name: gatling-at-once
    volumes:
      - ./gatling/simulations:/opt/gatling/user-files/simulations
      - ./gatling/results:/opt/gatling/results
    depends_on:
      - echo-hello
      - gin-hello
    entrypoint: ["/bin/sh", "-c", "gatling.sh -s ServerAtOnceLoadSimulation"]

  gatling-per-second:
    image: denvazh/gatling:latest
    container_name: gatling-per-second
    volumes:
      - ./gatling/simulations:/opt/gatling/user-files/simulations
      - ./gatling/results:/opt/gatling/results
    depends_on:
      gatling-at-once:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c", "gatling.sh -s ServerPerSecondLoadSimulation"]
  

  gatling-results:
    image: denvazh/gatling:latest
    container_name: gatling-results
    volumes:
      - ./gatling/simulations:/opt/gatling/user-files/simulations
      - ./gatling/results:/opt/gatling/results
    entrypoint: ["/bin/sh", "-c", "gatling.sh -o $(ls /opt/gatling/user-files/simulations/*simulation.log) -o serveratonceloadsimulation-trend"]
   